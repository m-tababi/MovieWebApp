{% extends "base.html" %}

{% block content %}
    <h2>Userliste</h2>

    {% if users %}
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                        <tr>
                            <td>{{ user.user_id }}</td>
                            <td>
                                <a href="{{ url_for('get_movies', user_id=user.user_id) }}">
                                    {{ user.name }}
                                </a>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    {% else %}
        <div class="empty-state">
            Es sind noch keine User in der Datenbank vorhanden.
        </div>
    {% endif %}
{% endblock %}
